# ==============================================================================
# NGINX High-Performance Reverse Proxy & SSL Gateway for Wap Mobility
# Features: HTTP/2, SSL Termination, Socket.IO WebSocket Upgrades, Gzip, HSTS
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging optimization
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_ext;
    error_log /var/log/nginx/error.log warn;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25M;

    # Gzip Compression for Low-Bandwidth 2G/3G Cellular Networks
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # WebSocket / HTTP Upgrade Mapping for Socket.IO
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Express/Socket.IO Cluster
    upstream wap_backend {
        server api:3000;
        keepalive 64;
    }

    # Rate Limiting Zone against API Brute Force
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;

    # --------------------------------------------------------------------------
    # 1. HTTP INGRESS (Port 80) -> Let's Encrypt ACME Challenge or HTTPS 301
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.wapmobility.com app.wapmobility.com _;

        # ACME Webroot for Certbot Automatic SSL Verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS SECURE INGRESS (Port 443) -> SSL Termination & WebSocket Proxy
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.wapmobility.com app.wapmobility.com;

        # SSL Certificates provisioned via Certbot
        ssl_certificate /etc/letsencrypt/live/api.wapmobility.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.wapmobility.com/privkey.pem;

        # Modern SSL Configuration (TLS 1.2 & 1.3 only, high security cipher suites)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ----------------------------------------------------------------------
        # A. SOCKET.IO / WEBSOCKET TELEMETRY PROXY
        # ----------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://wap_backend/socket.io/;
            proxy_http_version 1.1;

            # Crucial WebSocket Upgrade Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward Client Identity & Origin Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable Buffering for Real-time Latency (<20ms)
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;

            # Long timeouts for persistent GPS telemetry streams
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # B. REST API ROUTES (PostGIS Dispatch, Dynamic Pricing, Auth)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_rate_limit burst=50 nodelay;

            proxy_pass http://wap_backend/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # C. SPA FRONTEND ASSETS & FALLBACK
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://wap_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
