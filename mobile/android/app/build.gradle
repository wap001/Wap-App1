// ==============================================================================
// Wap Mobility - Android App-Level Gradle Build Configuration
// File: android/app/build.gradle
// Compatible with: Flutter 3.x+ and React Native 0.73+
// Minimum SDK: API 21 (Android 5.0 Lollipop) for maximum global handset compatibility
// Target/Compile SDK: API 34 (Android 14)
// ==============================================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin" apply false
}

import java.io.FileInputStream
import java.util.Properties

// Load release keystore credentials from key.properties if available
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.wapmobility.app"
    compileSdkVersion 34
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.wapmobility.app"
        // API 21+ guarantees compatibility with 99.4% of active worldwide Android devices,
        // including legacy Transsion (Tecno/Infinix), Samsung Galaxy A-series, and Xiaomi handsets in emerging markets
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 10001
        versionName "1.0.0"

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
            appName: "Wap Mobility",
            usesCleartextTraffic: "false"
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (keystoreProperties['storeFile'] != null) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else {
                // Fallback to CI environment variables if key.properties is omitted
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "wap-upload-key"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "wap-upload-key.jks")
                storePassword System.getenv("ANDROID_STORE_PASSWORD") ?: ""
            }
        }
    }

    flavorDimensions "environment"

    productFlavors {
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            manifestPlaceholders = [
                appName: "Wap [Staging]",
                usesCleartextTraffic: "true"
            ]
        }

        production {
            dimension "environment"
            manifestPlaceholders = [
                appName: "Wap Mobility",
                usesCleartextTraffic: "false"
            ]
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }

        staging {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.release
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".staging"
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            ndk {
                // Optimize binary size for 2G/3G networks: ARM64 and ARMv7 cover 99% of emerging market phones
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
        }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
}
